<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 320" role="img" aria-labelledby="title desc">
  <title id="title">Arcade neon banner</title>
  <desc id="desc">Abstract neon game-show banner with glowing grid lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#081126"/>
      <stop offset="100%" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#26f2ff"/>
      <stop offset="100%" stop-color="#ff4fd8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1400" height="320" fill="url(#bg)"/>
  <g opacity="0.32" stroke="url(#line)">
    <path d="M0 245H1400"/>
    <path d="M0 210H1400"/>
    <path d="M0 175H1400"/>
    <path d="M0 140H1400"/>
    <path d="M150 0V320"/>
    <path d="M420 0V320"/>
    <path d="M690 0V320"/>
    <path d="M960 0V320"/>
    <path d="M1230 0V320"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="260" cy="88" r="42" fill="#26f2ff" fill-opacity="0.22"/>
    <circle cx="1160" cy="95" r="58" fill="#ff4fd8" fill-opacity="0.24"/>
    <rect x="512" y="70" width="376" height="118" rx="18" fill="none" stroke="url(#line)" stroke-width="6"/>
  </g>
</svg>
